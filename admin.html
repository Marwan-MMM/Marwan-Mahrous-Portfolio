<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>~/admin — redirecting…</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%230A0B0D'/%3E%3Crect x='6' y='6' width='9' height='12' fill='%23C7F542'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0A0B0D;--bg2:#0F1113;--txt:#E9EAE4;--dim:rgba(233,234,228,.34);--line:rgba(233,234,228,.13);--acc:#C7F542;--f-mono:'JetBrains Mono',monospace}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem;background:var(--bg);color:var(--txt);font-family:'Space Grotesk',sans-serif}
  .gate-logo{font-family:var(--f-mono);font-size:1.25rem;display:flex;align-items:center;gap:2px}
  .gate-logo b{color:var(--acc);font-weight:500}
  .caret{width:.55em;height:1.05em;background:var(--acc);margin-left:5px;animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  p{font-family:var(--f-mono);font-size:.68rem;color:var(--dim);line-height:1.7;text-align:center;max-width:44ch}
  a{font-family:var(--f-mono);font-size:.72rem;color:var(--acc);text-decoration:none;border:1px solid var(--line);padding:.6rem 1rem;border-radius:3px;transition:border-color .25s}
  a:hover{border-color:var(--acc)}
</style>
<script>
/* The admin panel lives INSIDE the site (index.html) — this standalone page
   used to be a dead, non-functional duplicate. Forward to the real one. */
setTimeout(function(){ location.replace('index.html#admin'); }, 400);
</script>
</head>
<body>
  <div class="gate-logo">~/<b>admin</b><span class="caret"></span></div>
  <p>The admin console is built into the site. Redirecting you to the sign-in panel…</p>
  <a href="index.html#admin">open admin now</a>
</body>
</html>
